[package]
name = "termscope"
version = "0.1.1"
edition = "2024"
repository = "https://github.com/ThomasSimard/termscope"

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = "0.29.0"
ratatui = "0.30.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
